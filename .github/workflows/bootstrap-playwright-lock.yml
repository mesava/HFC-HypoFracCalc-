name: Bootstrap Playwright lockfile

on:
  push:
    branches: ["browser-qa-v0.1"]
    paths:
      - ".github/workflows/bootstrap-playwright-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: browser-qa-v0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked Playwright test dependency
        run: npm install --save-dev --save-exact @playwright/test@1.63.0

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add locked Playwright test dependency"
          git push origin HEAD:browser-qa-v0.1
