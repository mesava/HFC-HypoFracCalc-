name: Cleanup merged branches

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete branches fully merged into main
        shell: bash
        run: |
          set -u

          deleted=0
          kept=0

          superseded_branches=(
            "audit-schema-v1.1-current"
            "evidence-v0.1"
            "hytec-constraints-v0.2"
            "regimen-library-v0.2"
            "reirradiation-guidance-v0.1"
            "treatment-time-basis-v0.3"
            "treatment-time-model-v0.1"
          )

          is_superseded_branch() {
            local candidate="$1"
            local item
            for item in "${superseded_branches[@]}"; do
              if [[ "$candidate" == "$item" ]]; then
                return 0
              fi
            done
            return 1
          }

          while IFS= read -r branch; do
            case "$branch" in
              HEAD|main|develop)
                continue
                ;;
            esac

            remote_ref="refs/remotes/origin/$branch"

            if git merge-base --is-ancestor "$remote_ref" "refs/remotes/origin/main"; then
              echo "Deleting merged branch: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Could not delete $branch"
                kept=$((kept + 1))
              fi
            elif is_superseded_branch "$branch"; then
              echo "Deleting reviewed superseded branch: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Could not delete superseded branch $branch"
                kept=$((kept + 1))
              fi
            else
              echo "Keeping branch with commits not in main: $branch"
              kept=$((kept + 1))
            fi
          done < <(
            git for-each-ref               --format='%(refname:strip=3)'               refs/remotes/origin               | sort
          )

          echo "Deleted merged branches: $deleted"
          echo "Kept non-merged/protected branches: $kept"
